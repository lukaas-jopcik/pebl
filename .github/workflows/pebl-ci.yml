name: pebl CI

on:
  push:
    paths:
      - 'packages/pebl/**'
      - '.github/workflows/pebl-ci.yml'
  pull_request:
    paths:
      - 'packages/pebl/**'
      - '.github/workflows/pebl-ci.yml'

defaults:
  run:
    working-directory: packages/pebl

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/pebl/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
